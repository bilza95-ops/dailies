<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dailies">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E1116">
<title>Dailies — departures</title>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --board:#0E1116;
  --panel:#161B22;
  --panel-2:#1B212A;
  --rule:#252D38;
  --amber:#FFB020;
  --amber-dim:#8A6520;
  --chalk:#E7EAEE;
  --dim:#6C7684;
  --depart:#35D07F;
  --cancel:#FF5C63;
  --flapface:#20262F;
  --board-font:"Barlow Condensed","Arial Narrow",Haettenschweiler,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
body{
  margin:0;background:var(--board);color:var(--chalk);
  font-family:var(--board-font);font-size:17px;line-height:1.3;
  -webkit-font-smoothing:antialiased;
}
/* faint board sheen */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.5;
  background:radial-gradient(120% 70% at 50% -10%,rgba(255,176,32,.055),transparent 60%);
}
.wrap{max-width:620px;margin:0 auto;padding:16px 12px 40px;position:relative;z-index:1}

/* ---------- masthead ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
.mark{font-weight:700;font-size:1.9rem;letter-spacing:.06em;margin:0;line-height:.95;color:var(--amber)}
.sub{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;color:var(--dim);margin-top:4px}
.clock{font-family:var(--mono);font-weight:600;font-size:1.25rem;color:var(--chalk);
  letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- summary strip ---------- */
.strip{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.chip{flex:1 1 auto;min-width:96px;background:var(--panel);border:1px solid var(--rule);
  border-radius:3px;padding:8px 10px}
.chip .n{font-family:var(--mono);font-weight:600;font-size:1.15rem;line-height:1.1;
  font-variant-numeric:tabular-nums}
.chip .l{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;color:var(--dim);margin-top:3px}
.chip.go .n{color:var(--depart)}
.chip.no .n{color:var(--cancel)}
.chip.tm .n{color:var(--amber)}

/* ---------- next departure ---------- */
.next{display:flex;align-items:center;gap:10px;background:var(--panel-2);
  border:1px solid var(--amber-dim);border-radius:3px;padding:11px 12px;margin-bottom:14px}
.next .body{flex:1;min-width:0}
.next .lbl{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;color:var(--amber);margin-bottom:2px}
.next .nm{font-weight:700;font-size:1.25rem;letter-spacing:.03em;text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .bl{font-family:var(--mono);font-size:.66rem;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-btn{flex:0 0 auto;font-family:var(--mono);font-weight:600;font-size:.72rem;letter-spacing:.1em;
  background:var(--amber);color:#14181D;border:0;border-radius:3px;padding:11px 13px;
  text-decoration:none;cursor:pointer;white-space:nowrap}
.next[hidden]{display:none}

/* ---------- filter ---------- */
.filter{display:flex;justify-content:flex-end;margin-bottom:8px}
.filter button{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;color:var(--dim);
  background:transparent;border:1px solid var(--rule);border-radius:3px;padding:6px 10px;cursor:pointer}
.filter button.on{color:var(--amber);border-color:var(--amber-dim)}

/* ---------- sections ---------- */
.sec{margin-bottom:16px;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  background:var(--panel-2);padding:8px 12px;border-bottom:1px solid var(--rule)}
.sec-head .t{font-weight:700;font-size:1rem;letter-spacing:.11em;color:var(--amber)}
.sec-head .c{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;color:var(--dim)}

/* ---------- services ---------- */
.svc{display:flex;align-items:stretch;border-top:1px solid var(--rule);background:var(--panel)}
.svc:first-child{border-top:0}
.svc:nth-child(even){background:#141920}
.svc.gone{display:none}
.dest{flex:1;min-width:0;display:block;text-decoration:none;color:inherit;padding:9px 6px 9px 12px}
.nm{font-weight:600;font-size:1.18rem;letter-spacing:.035em;text-transform:uppercase;
  line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svc.departed .nm{color:var(--dim)}
.bl{font-family:var(--mono);font-size:.65rem;color:var(--dim);line-height:1.35;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;align-items:center;gap:9px;margin-top:5px}
.status{font-family:var(--mono);font-weight:600;font-size:.68rem;letter-spacing:.06em;
  color:var(--amber);white-space:pre}
.status.departed{color:var(--depart)}
.status.cancelled{color:var(--cancel)}
.flap{display:inline-block;width:.64em;text-align:center;position:relative}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;
  background:var(--board);opacity:.55}
.run{font-family:var(--mono);font-size:.63rem;color:var(--dim);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.run b{color:var(--chalk);font-weight:600}
.wk{display:flex;gap:2px;margin-left:auto;padding-right:2px}
.d{width:6px;height:6px;border-radius:1px;background:var(--flapface)}
.d.on{background:var(--depart)}
.d.no{background:var(--cancel)}

.acts{flex:0 0 auto;display:flex}
.act{width:44px;border:0;border-left:1px solid var(--rule);background:transparent;
  color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:color .15s ease}
.act svg{width:20px;height:20px}
.svc.departed .act.go{color:var(--depart)}
.svc.cancelled .act.no{color:var(--cancel)}
a:focus-visible,button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}

footer{margin-top:22px;border-top:1px solid var(--rule);padding-top:14px;
  font-family:var(--mono);font-size:.64rem;line-height:1.7;color:var(--dim)}
footer p{margin:0 0 8px}
.acts-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.acts-row button{font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;color:var(--dim);
  background:transparent;border:1px solid var(--rule);border-radius:3px;padding:7px 11px;cursor:pointer}
.warn{color:var(--amber)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div>
      <h1 class="mark">DAILIES</h1>
      <div class="sub" id="dateline">DEPARTURES</div>
    </div>
    <div class="clock" id="clock">--:--</div>
  </div>

  <div class="strip">
    <div class="chip go"><div class="n" id="cDep">0</div><div class="l">DEPARTED</div></div>
    <div class="chip no"><div class="n" id="cCan">0</div><div class="l">CANCELLED</div></div>
    <div class="chip tm"><div class="n" id="cEnd">--</div><div class="l">LAST SERVICE</div></div>
  </div>

  <a class="next" id="next" target="_blank" rel="noopener noreferrer">
    <div class="body">
      <div class="lbl">NEXT DEPARTURE</div>
      <div class="nm" id="nextNm"></div>
      <div class="bl" id="nextBl"></div>
    </div>
    <span class="board-btn">BOARD &rarr;</span>
  </a>

  <div class="filter">
    <button type="button" id="hide">HIDE DEPARTED</button>
  </div>

  <main id="list"></main>

  <footer>
    <p>Saved on this device only. Nothing leaves your machine.</p>
    <p id="store"></p>
    <div class="acts-row">
      <button type="button" id="backup">COPY BACKUP</button>
      <button type="button" id="restore">RESTORE</button>
      <button type="button" id="reset">CLEAR ALL RUNS</button>
    </div>
  </footer>
</div>

<script>
(function(){
"use strict";

var GAMES=[
 {g:"WORDS",items:[

  {id:"li-crossclimb",n:"Crossclimb",b:"trivia rungs into a word ladder",u:"https://www.linkedin.com/games/crossclimb"},
  {id:"li-wend",n:"Wend",b:"hidden words that partition the grid",u:"https://www.linkedin.com/games/wend/"}
 ]},
 {g:"LOGIC",items:[
  {id:"cluesbysam",n:"Clues By Sam",b:"twenty suspects, no guessing allowed",u:"https://cluesbysam.com"},
  {id:"spectra",n:"Spectra",b:"sort by a metric you must deduce",u:"https://spectra.quest"},
  {id:"murdle-x",n:"Parlorbox",b:"the Parlor room puzzle from Blue Prince",u:"https://parlorbox.com/"},
  {id:"zebra",n:"Zebra Puzzles",b:"five logic grids, rising difficulty",u:"https://www.zebrapuzzles.com"},
  {id:"li-queens",n:"Queens",b:"one crown per row, column and region",u:"https://www.linkedin.com/games/queens"},
  {id:"li-tango",n:"Tango",b:"balance the suns and moons",u:"https://www.linkedin.com/games/tango"},
  {id:"li-zip",n:"Zip",b:"one path through every cell, in order",u:"https://www.linkedin.com/games/zip"},
  {id:"li-minisudoku",n:"Mini Sudoku",b:"6x6, two minutes",u:"https://www.linkedin.com/games/mini-sudoku/"},
  {id:"li-patches",n:"Patches",b:"each number inside a rectangle of that area",u:"https://www.linkedin.com/games/patches/"},
  {id:"starstruck",n:"Starstruck",b:"star battle, no Netflix account needed",u:"https://www.netflix.com/tudum/puzzled/starstruck/daily"},
  {id:"akari",n:"Daily Akari",b:"light up the whole grid",u:"https://dailyakari.com"},
  {id:"shikaku",n:"Shikaku",b:"split the grid into numbered rectangles",u:"https://shikakuofthe.day"},
  {id:"loopy",n:"Loopy",b:"one loop obeying the numbers",u:"https://loopy.wtf"},
  {id:"sumplete",n:"Sumplete",b:"delete numbers to hit every target",u:"https://sumplete.com/daily"},
  {id:"nonodaily",n:"NonoDaily",b:"handmade nonograms",u:"https://www.nonodaily.com"},
  {id:"mineswifter",n:"Mineswifter",b:"minesweeper that's always solvable",u:"https://mineswifter.com"},
  {id:"nerdle-classic",n:"Nerdle Classic",b:"8 characters",u:"https://nerdlegame.com/"},
  {id:"nerdle-micro",n:"Nerdle Micro",b:"5 characters",u:"https://micro.nerdlegame.com/"},
  {id:"nerdle-mini",n:"Nerdle Mini",b:"6 characters",u:"https://mini.nerdlegame.com/"},
  {id:"nerdle-midi",n:"Nerdle Midi",b:"7 characters",u:"https://midi.nerdlegame.com/"}
 ]},
 {g:"WORLD",items:[
  {id:"framed",n:"Framed",b:"the film, one frame at a time",u:"https://framed.wtf"},
  {id:"bandle",n:"Bandle",b:"the song, one instrument at a time",u:"https://bandle.app"},
  {id:"travle",n:"Travle",b:"walk between two countries",u:"https://travle.earth"},
  {id:"timeguessr",n:"TimeGuessr",b:"where the photo was taken, and when",u:"https://timeguessr.com"},
  {id:"chronle",n:"Chronle",b:"put the events in order",u:"https://chronle.com"},
  {id:"costcodle",n:"Costcodle",b:"guess the price of a Costco item",u:"https://costcodle.com"}
 ]}
];

var ALL=[];
GAMES.forEach(function(s){s.items.forEach(function(i){ALL.push(i);});});
var IDS=ALL.map(function(e){return e.id;});
var BY={};ALL.forEach(function(e){BY[e.id]=e;});

var KEY="dailies.v1", PEND="dailies.pending", HIDE="dailies.hideDeparted", COOKIE="dailies",
    EPOCH=Date.UTC(2025,0,1), WINDOW_DAYS=400, CK_DAYS=90;
var state={v:2,updatedAt:0,done:{},miss:{}};
var REDUCE=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- dates ---------- */
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function shift(n){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+n);return iso(d);}
function idx(s){var p=s.split("-");return Math.round((Date.UTC(+p[0],+p[1]-1,+p[2])-EPOCH)/86400000);}
function fromIdx(n){var d=new Date(EPOCH+n*86400000);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");}
var TODAY=shift(0);

function runLength(id){
  var set=Object.create(null);
  state.done[id].forEach(function(d){set[d]=1;});
  state.miss[id].forEach(function(d){set[d]=1;});
  var i=set[TODAY]?0:(set[shift(-1)]?-1:null);
  if(i===null)return 0;
  var n=0;while(set[shift(i)]){n++;i--;}
  return n;
}

/* ---------- storage ---------- */
function blank(){
  var a={},b={};IDS.forEach(function(id){a[id]=[];b[id]=[];});
  return {v:2,updatedAt:0,done:a,miss:b};
}
function cleanList(v,floor){
  if(!Array.isArray(v))return [];
  var seen=Object.create(null),keep=[];
  v.forEach(function(d){
    if(typeof d!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(d))return;
    if(seen[d]||idx(d)<floor)return;
    seen[d]=1;keep.push(d);
  });
  return keep.sort();
}
var LEGACY={octordle:"octordle-classic",nerdle:"nerdle-classic",crosswordle:"crosswordle-7"};
function tidy(raw){
  var out=blank(),floor=idx(TODAY)-WINDOW_DAYS;
  out.updatedAt=(raw&&raw.updatedAt)||0;
  function pull(src,target){
    Object.keys(src||{}).forEach(function(key){
      var id=LEGACY[key]||key,cur=target[id];
      if(!cur)return;
      cleanList(src[key],floor).forEach(function(d){if(cur.indexOf(d)===-1)cur.push(d);});
      cur.sort();
    });
  }
  pull((raw&&raw.done)||{},out.done);
  pull((raw&&raw.miss)||{},out.miss);
  IDS.forEach(function(id){
    var solved=out.done[id];
    out.miss[id]=out.miss[id].filter(function(d){return solved.indexOf(d)===-1;});
  });
  return out;
}
function encodeCookie(){
  var base=idx(TODAY)-(CK_DAYS-1),parts=[];
  IDS.forEach(function(id){
    var bits=new Array(CK_DAYS*2).fill(0);
    state.done[id].forEach(function(d){var k=idx(d)-base;if(k>=0&&k<CK_DAYS)bits[k*2]=1;});
    state.miss[id].forEach(function(d){var k=idx(d)-base;if(k>=0&&k<CK_DAYS)bits[k*2+1]=1;});
    var hex="";
    for(var i=0;i<bits.length;i+=4){
      hex+=((bits[i]<<3)|(bits[i+1]<<2)|(bits[i+2]<<1)|bits[i+3]).toString(16);
    }
    parts.push(hex.replace(/0+$/,""));
  });
  return base+"~"+parts.join("~");
}
function decodeCookie(str){
  var parts=str.split("~"),base=parseInt(parts[0],10);
  if(isNaN(base))return null;
  var out=blank();
  IDS.forEach(function(id,gi){
    var hex=parts[gi+1]||"";
    for(var i=0;i<hex.length;i++){
      var nib=parseInt(hex[i],16);if(isNaN(nib)||!nib)continue;
      for(var b=0;b<4;b++){
        if(!(nib&(8>>b)))continue;
        var bit=i*4+b,day=base+Math.floor(bit/2);
        (bit%2===0?out.done[id]:out.miss[id]).push(fromIdx(day));
      }
    }
    out.done[id].sort();out.miss[id].sort();
  });
  return out;
}
function save(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}
  try{document.cookie=COOKIE+"="+encodeURIComponent(encodeCookie())+";max-age=34560000;path=/;SameSite=Lax";}catch(e){}
}
function load(){
  try{var raw=localStorage.getItem(KEY);if(raw)return tidy(JSON.parse(raw));}catch(e){}
  try{var m=document.cookie.match(/(?:^|;\s*)dailies=([^;]*)/);
    if(m){var d=decodeCookie(decodeURIComponent(m[1]));if(d)return tidy(d);}}catch(e){}
  return blank();
}

/* ---------- split-flap engine ---------- */
var FLAPSET="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ";
var jobs=[],ticker=null;
function tick(){
  for(var j=jobs.length-1;j>=0;j--){
    var job=jobs[j],alive=false;
    for(var i=0;i<job.spans.length;i++){
      var st=job.state[i];
      if(st.done)continue;
      st.n++;
      if(st.n>=st.ticks){job.spans[i].textContent=job.chars[i];st.done=true;}
      else{job.spans[i].textContent=FLAPSET.charAt((Math.random()*FLAPSET.length)|0);alive=true;}
    }
    if(!alive)jobs.splice(j,1);
  }
  if(!jobs.length){clearInterval(ticker);ticker=null;}
}
function flap(cell,text){
  var chars=text.split("");
  if(REDUCE){cell.textContent=text;return;}
  cell.textContent="";
  var spans=[],st=[];
  chars.forEach(function(c,i){
    var s=document.createElement("span");
    s.className="flap";s.textContent=" ";
    cell.appendChild(s);spans.push(s);
    st.push({n:0,ticks:5+i*2+((Math.random()*3)|0),done:false});
  });
  jobs.push({spans:spans,chars:chars,state:st});
  if(!ticker)ticker=setInterval(tick,42);
}

/* ---------- build ---------- */
var listEl=document.getElementById("list"),clockEl=document.getElementById("clock"),
    dateEl=document.getElementById("dateline"),nextEl=document.getElementById("next"),
    nextNm=document.getElementById("nextNm"),nextBl=document.getElementById("nextBl"),
    cDep=document.getElementById("cDep"),cCan=document.getElementById("cCan"),
    cEnd=document.getElementById("cEnd"),storeEl=document.getElementById("store"),
    hideBtn=document.getElementById("hide");
var rows={},secs=[],hideDeparted=false;

function remember(id){
  try{localStorage.setItem(PEND,JSON.stringify({id:id,t:Date.now()}));}catch(e){}
}

var TICK='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">'+
  '<path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.3" '+
  'stroke-linecap="round" stroke-linejoin="round"/></svg>';
var CROSS='<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">'+
  '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2.3" '+
  'stroke-linecap="round"/></svg>';

GAMES.forEach(function(sec){
  var box=document.createElement("section");box.className="sec";
  var head=document.createElement("div");head.className="sec-head";
  head.innerHTML='<div class="t"></div><div class="c"></div>';
  head.querySelector(".t").textContent=sec.g;
  box.appendChild(head);

  sec.items.forEach(function(it){
    var row=document.createElement("div");row.className="svc";row.id="s-"+it.id;

    var a=document.createElement("a");
    a.className="dest";a.href=it.u;a.target="_blank";a.rel="noopener noreferrer";
    a.innerHTML='<div class="nm"></div><div class="bl"></div>'+
      '<div class="meta"><span class="status"></span><span class="run"></span>'+
      '<span class="wk"></span></div>';
    a.querySelector(".nm").textContent=it.n;
    a.querySelector(".bl").textContent=it.b;
    a.addEventListener("click",function(){remember(it.id);});

    var wk=a.querySelector(".wk"),days=[];
    for(var i=-6;i<=0;i++){
      var s=document.createElement("span");s.className="d";
      wk.appendChild(s);days.push(s);
    }

    var acts=document.createElement("div");acts.className="acts";
    var no=document.createElement("button");
    no.type="button";no.className="act no";no.innerHTML=CROSS;
    no.addEventListener("click",function(){toggle(it.id,"miss");});
    var go=document.createElement("button");
    go.type="button";go.className="act go";go.innerHTML=TICK;
    go.addEventListener("click",function(){toggle(it.id,"done");});
    acts.appendChild(no);acts.appendChild(go);

    row.appendChild(a);row.appendChild(acts);box.appendChild(row);
    rows[it.id]={el:row,go:go,no:no,days:days,
      status:a.querySelector(".status"),run:a.querySelector(".run"),shown:false};
  });

  listEl.appendChild(box);
  secs.push({el:box,count:head.querySelector(".c"),ids:sec.items.map(function(i){return i.id;})});
});

/* flap each service in as it scrolls onto the board */
var io=null;
if(window.IntersectionObserver&&!REDUCE){
  io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting)return;
      var id=en.target.id.slice(2),r=rows[id];
      io.unobserve(en.target);
      if(r&&!r.shown){r.shown=true;flap(r.status,statusFor(id).text);}
    });
  },{rootMargin:"60px"});
  ALL.forEach(function(e){io.observe(rows[e.id].el);});
}

function statusFor(id){
  if(state.done[id].indexOf(TODAY)!==-1)return {text:"DEPARTED ",cls:"departed"};
  if(state.miss[id].indexOf(TODAY)!==-1)return {text:"CANCELLED",cls:"cancelled"};
  return {text:"ON TIME  ",cls:""};
}

/* ---------- render ---------- */
function render(changed){
  var dep=0,can=0,next=null;
  ALL.forEach(function(e){
    var s=statusFor(e.id);
    if(s.cls==="departed")dep++;else if(s.cls==="cancelled")can++;
    if(!s.cls&&!next)next=e;

    var r=rows[e.id];
    r.el.classList.toggle("departed",s.cls==="departed");
    r.el.classList.toggle("cancelled",s.cls==="cancelled");
    r.el.classList.toggle("gone",hideDeparted&&s.cls==="departed");
    r.status.className="status "+s.cls;
    if(e.id===changed&&r.shown)flap(r.status,s.text);
    else if(r.shown||REDUCE||!io)r.status.textContent=s.text;

    r.go.setAttribute("aria-pressed",s.cls==="departed"?"true":"false");
    r.no.setAttribute("aria-pressed",s.cls==="cancelled"?"true":"false");
    r.go.setAttribute("aria-label","Mark "+e.n+" solved");
    r.no.setAttribute("aria-label","Mark "+e.n+" missed");

    for(var i=0;i<7;i++){
      var d=shift(i-6);
      r.days[i].classList.toggle("on",state.done[e.id].indexOf(d)!==-1);
      r.days[i].classList.toggle("no",state.miss[e.id].indexOf(d)!==-1);
    }
    var n=runLength(e.id);
    r.run.innerHTML=n?'<b>'+n+'</b> DAY RUN':"";
  });

  secs.forEach(function(s){
    var left=0;
    s.ids.forEach(function(id){if(!statusFor(id).cls)left++;});
    s.count.textContent=left?left+" AWAITING":"ALL CLEAR";
  });

  cDep.textContent=dep;
  cCan.textContent=can;

  if(next){
    nextEl.hidden=false;nextEl.href=next.u;
    nextNm.textContent=next.n;nextBl.textContent=next.b;
    nextEl.onclick=(function(id){return function(){remember(id);};})(next.id);
  }else{nextEl.hidden=true;}
}

function toggle(id,kind){
  var mine=state[kind][id],other=state[kind==="done"?"miss":"done"][id];
  var i=mine.indexOf(TODAY);
  if(i===-1){
    mine.push(TODAY);mine.sort();
    var j=other.indexOf(TODAY);if(j!==-1)other.splice(j,1);
    if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
  }else{mine.splice(i,1);}
  save();render(id);
}

/* ---------- returning from a puzzle ---------- */
function checkPending(){
  var raw;try{raw=localStorage.getItem(PEND);}catch(e){return;}
  if(!raw)return;
  var p;try{p=JSON.parse(raw);}catch(e){clearPending();return;}
  var age=Date.now()-(p.t||0);
  if(!BY[p.id]||age>6*3600000){clearPending();return;}
  if(statusFor(p.id).cls){clearPending();return;}
  if(age<12000)return;
  var r=rows[p.id];
  if(r)r.el.scrollIntoView({behavior:REDUCE?"auto":"smooth",block:"center"});
  clearPending();
}
function clearPending(){try{localStorage.removeItem(PEND);}catch(e){}}

function syncFromStore(){
  var raw;try{raw=localStorage.getItem(KEY);}catch(e){return;}
  if(!raw)return;
  var inc;try{inc=tidy(JSON.parse(raw));}catch(e){return;}
  if((inc.updatedAt||0)>(state.updatedAt||0)){state=inc;render();}
}
document.addEventListener("visibilitychange",function(){
  if(!document.hidden){syncFromStore();checkPending();}
});
window.addEventListener("pageshow",function(){syncFromStore();checkPending();});
window.addEventListener("focus",function(){syncFromStore();checkPending();});
window.addEventListener("storage",function(e){if(e.key===KEY)syncFromStore();});

/* ---------- clock ---------- */
var lastClock="";
function tickClock(){
  var now=shift(0);
  if(now!==TODAY){TODAY=now;render();}
  var d=new Date();
  var hh=String(d.getHours()).padStart(2,"0"),mm=String(d.getMinutes()).padStart(2,"0");
  var t=hh+":"+mm;
  if(t!==lastClock){lastClock=t;flap(clockEl,t);}
  var end=new Date(d);end.setHours(24,0,0,0);
  var mins=Math.max(0,Math.round((end-d)/60000));
  cEnd.textContent=Math.floor(mins/60)+"H "+(mins%60)+"M";
  dateEl.textContent="DEPARTURES \u00b7 "+
    d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}).toUpperCase();
}

/* ---------- filter ---------- */
function applyHide(){
  hideBtn.classList.toggle("on",hideDeparted);
  hideBtn.textContent=hideDeparted?"SHOW ALL":"HIDE DEPARTED";
  try{localStorage.setItem(HIDE,hideDeparted?"1":"0");}catch(e){}
  render();
}
hideBtn.addEventListener("click",function(){hideDeparted=!hideDeparted;applyHide();});

document.getElementById("reset").addEventListener("click",function(){
  if(!confirm("Clear every run and start again?"))return;
  state=blank();save();render();
});
document.getElementById("backup").addEventListener("click",function(){
  var txt=JSON.stringify(state);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){alert("Backup copied.");},
      function(){prompt("Copy this backup:",txt);});
  }else{prompt("Copy this backup:",txt);}
});
document.getElementById("restore").addEventListener("click",function(){
  var txt=prompt("Paste a backup:");
  if(!txt)return;
  try{state=tidy(JSON.parse(txt));save();render();}catch(e){alert("That didn't look like a backup.");}
});

/* ---------- go ---------- */
state=load();
try{hideDeparted=localStorage.getItem(HIDE)==="1";}catch(e){}
hideBtn.classList.toggle("on",hideDeparted);
hideBtn.textContent=hideDeparted?"SHOW ALL":"HIDE DEPARTED";
render();
checkPending();
tickClock();
setInterval(tickClock,20000);

var ls=false;try{localStorage.setItem("_t","1");localStorage.removeItem("_t");ls=true;}catch(e){}
var ck=false;try{document.cookie="_t=1;path=/";ck=document.cookie.indexOf("_t=1")!==-1;
  document.cookie="_t=;max-age=0;path=/";}catch(e){}
storeEl.innerHTML= ls&&ck ? "LOCAL STORAGE, MIRRORED TO A COOKIE"
  : ls ? 'LOCAL STORAGE \u00b7 <span class="warn">COOKIES BLOCKED HERE</span>'
  : ck ? "COOKIE ONLY"
  : '<span class="warn">STORAGE BLOCKED \u00b7 KEEP BACKUPS</span>';
})();
</script>
